<!DOCTYPE html>

<head>

    <title>FoodieHub Cart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
        }

        /* NAVBAR */
        nav {
            background: linear-gradient(to right, #ff4b2b, #f39c12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
        }

        .logo {
            color: white;
            font-size: 30px;
            font-weight: bold;
        }

        .menu a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin: 0 10px;
        }

        .menu a:hover {
            color: #fff3cd;
        }

        /* CART */
        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        button {
            padding: 12px 18px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 16px;
            color: white;
            background: #ff5722;
        }

        button:hover {
            background: black;
        }

        .checkout {
            background: #111;
        }

        /* POPUP */
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .popup-box {
            background: white;
            width: 350px;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .popup-box h2 {
            color: #ff5722;
            margin-bottom: 15px;
        }

        .popup-buttons {
            margin-top: 20px;
        }

        .ok-btn {
            background: #28a745;
            margin-right: 10px;
        }

        .cancel-btn {
            background: #dc3545;
        }
    </style>

        <div class="actions">
            <button class="checkout" onclick="checkout()">Checkout</button>
        </div>

    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        const loggedInUser = localStorage.getItem("loggedUser");

        if (!loggedInUser) {
            alert("Please login first!");
            window.location.href = "login.html";
        }

        function loadCart() {
            let box = document.getElementById("cartItems");
            let total = 0;

            box.innerHTML = "";

            if (cart.length === 0) {
                box.innerHTML = "<p>Cart is empty 🛒</p>";
                return;
            }

            cart.forEach(item => {
                total += item.price;
                box.innerHTML += `
                <div class="item">
                    <span>${item.name}</span>
                    <span>₹${item.price}</span>
                </div>
            `;
            });

            document.getElementById("total").innerText = total;
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Cart is empty!");
                return;
            }

            // ✅ Check if user is logged in
            // const loggedInUser = localStorage.getItem("loggedUser");

            if (!loggedInUser) {
                alert("Please login first!");
                window.location.href = "login.html";
            } else {
                // Already logged in → go straight to checkout
                window.location.href = "checkout.html";
            }
        }

        function goLogin() {
            window.location.href = "login.html";
        }

        function closePopup() {
            document.getElementById("loginPopup").style.display = "none";
        }

        loadCart();
    </script>
