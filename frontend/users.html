<!DOCTYPE html>
<html>
<head>
<title>Users</title>
<style> 
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    min-height:100vh;
    background:#f4f6f9;
}

/* SIDEBAR */
.sidebar{
    width:250px;
    background:linear-gradient(to bottom,#ff4b2b,#ff9800);
    color:white;
    padding:20px;
    position:fixed;
    height:100%;
}

.sidebar h2{
    text-align:center;
    margin-bottom:25px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.2);
}

/* MAIN */
.main{
    margin-left:250px;
    padding:20px;
    width:100%;
}

/* TOPBAR */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
    padding:15px 20px;
    border-radius:10px;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-top:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
}

/* TABLE */
table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
}

th{
    background:#ff9800;
    color:white;
}

/* BUTTON */
.btn{
    padding:6px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.edit{background:#2ecc71;color:white;}
.delete{background:#e74c3c;color:white;}
</style>
</head>

<body>

<div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="admindashbord.html">Dashboard</a>
    <a href="users.html">Users</a>
    <a href="orders.html">Orders</a>
    <a href="products.html">Products</a>
    <a href="logout.html">Logout</a>
</div>

<div class="main">

    <div class="topbar">
        <h2>Users</h2>
        <button class="btn edit">Add User</button>
    </div>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Role</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Rahul</td>
            <td>User</td>
            <td>
                <button class="btn edit">Edit</button>
                <button class="btn delete">Delete</button>
            </td>
        </tr>
    </table>

</div>

</body>
</html>
