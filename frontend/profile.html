<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Background */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #aa8570, #a1722e, #a56e7b, #382042);
            background-size: 400% 400%;
            animation: bgAnimation 10s ease infinite;
        }

        @keyframes bgAnimation {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* NAVBAR */
        nav {
            background: linear-gradient(to right, #ff4b2b, #f39c12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            flex-wrap: wrap;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .menu a {
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        /* PROFILE */
        .container {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .profile-pic-container {
            position: relative;
            width: 120px;
            margin: auto;
        }

        .profile-pic-container img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff5722;
        }

        .edit-icon {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #ff5722;
            color: white;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        h1 {
            margin: 15px 0;
            color: #ff0000;
        }

        .info {
            text-align: left;
            margin-top: 20px;
        }

        .info p {
            margin: 10px 0;
        }

        /* BUTTONS */
        button {
            margin-top: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: #ff5722;
            color: white;
            cursor: pointer;
        }

        /* ORDER BOX */
        #orderBox {
            display: none;
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }

        .order-item {
            border-bottom: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">🍔 FoodieHub</div>

        <div class="menu">
            <a href="index.html">Home</a>

    </nav>

    <div class="container">

        <div class="profile-card">

            <div class="profile-pic-container">

            <h1>User Profile</h1>

            <div class="info" id="info">
                <p><b>Name:</b> <span id="name"></span></p>

                <p><b>Mobile:</b> <span id="mobile"></span></p>
                <p><b>Address:</b> <span id="address"></span></p>
                <p><b>Total Orders:</b> <span id="totalOrders">0</span></p> <!-- ← add this -->
            </div>

            <button onclick="editProfile()">Edit Profile</button>
            <button onclick="showOrders()">View Orders</button> <!-- ← you had no trigger for showOrders! -->

            <!-- <button onclick="editProfile()">Edit Profile</button> -->

        </div>

    </div>

    <!-- ORDER POPUP -->
    <div id="orderBox">
        <h2>📦 Your Orders</h2>
        <div id="orderList"></div>
        <button onclick="closeOrders()">Close</button>
    </div>

    <script>
        // GET LOGGED USER
        let user = JSON.parse(localStorage.getItem("loggedUser"));

        if (!user) {
            alert("Please login first!");
            window.location.href = "login.html";
        }

        // LOAD PROFILE
        function loadProfile() {
            document.getElementById("name").innerText = user.name;
            document.getElementById("email").innerText = user.email;
            document.getElementById("mobile").innerText = user.mobile || "—";
            document.getElementById("address").innerText = user.address || "—";
        }

        // DYNAMICALLY COUNT USER'S ORDERS
        function loadOrderCount() {
            let allOrders = JSON.parse(localStorage.getItem("orders")) || [];
            let userOrders = allOrders.filter(o => o.customer?.email === user.email);
            document.getElementById("totalOrders").innerText = userOrders.length;
            return userOrders;
        }

        // IMAGE UPLOAD
        function uploadImage(event) {
            let file = event.target.files[0];
            let reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById("profileImage").src = e.target.result;
                localStorage.setItem("profileImage", e.target.result);
            };
            reader.readAsDataURL(file);
        }

        // EDIT PROFILE
        function editProfile() {
            let name = prompt("Name", user.name);
            let email = prompt("Email", user.email);
            let mobile = prompt("Mobile", user.mobile);
            let address = prompt("Address", user.address);

            if (name && email) {
                user.name = name;
                user.email = email;
                user.mobile = mobile;
                user.address = address;

                localStorage.setItem("loggedUser", JSON.stringify(user));
                loadProfile();
                loadOrderCount(); // ← refresh count after edit too
                alert("Updated!");
            }
        }

        // SHOW ORDERS POPUP
        function showOrders() {
            let orders = loadOrderCount(); // always fresh from localStorage
            let list = document.getElementById("orderList");
            list.innerHTML = "";

            if (orders.length === 0) {
                list.innerHTML = "<p>No orders found.</p>";
            } else {
                orders.slice().reverse().forEach(order => {
                    list.innerHTML += `
    <div class="order-item">
        <p><b>ID:</b> ${order.id}</p>
        <p><b>Total:</b> ₹${order.total}</p>
        <p><b>Status:</b> ${order.status}</p>
        <p><b>Date:</b> ${order.date || "—"}</p>
    </div>`;
                });
            }

            document.getElementById("orderBox").style.display = "block";
        }

        function closeOrders() {
            document.getElementById("orderBox").style.display = "none";
        }

        // LOAD SAVED PROFILE IMAGE
        let savedImage = localStorage.getItem("profileImage");
        if (savedImage) document.getElementById("profileImage").src = savedImage;

        // INIT
        loadProfile();
        loadOrderCount();

    </script>
</body>

</html>
