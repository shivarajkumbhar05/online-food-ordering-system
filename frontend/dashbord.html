<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub - Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background:
                linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1600&q=80");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            background: linear-gradient(90deg, #ff512f, #f09819);
            color: white;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        header a:hover {
            color: #ffe082;
        }

        /* CENTER CONTAINER */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
            padding: 20px;
        }

        /* CARD */
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }

        .card h1 {
            color: #ff5722;
            font-size: 42px;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 18px;
            color: #444;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* BUTTON */
        .btn {
            background: #ff5722;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
            transition: 0.3s;
        }

        .btn:hover {
            background: black;
        }

        /* FOOTER */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>


            <div class="logo">🍔 FoodieHub</div>

            <div class="menu">
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="additem.html">Add Item</a>
                <a href="cart.html">Cart</a>
                <a href="checkout.html">Checkout</a>
                <a href="history.html">History</a>
                <a href="about.html">About Us</a>
                <a href="profile.html">Profile</a>
                <a href="logout.html">Logout</a>
            </div>


    </header>

    <div class="container">

        <div class="card">

            <h1>Welcome to FoodieHub 🍕</h1>

            <p>
                Order delicious food from your favorite restaurants.
                Fast delivery, easy ordering, and tasty meals delivered
                right to your doorstep.
            </p>

            <a class="btn" href="menu.html">🍽 Order Now</a>

        </div>

    </div>

    <footer>
        © 2026 FoodieHub | Online Food Ordering System
    </footer>

</body>

</html>
