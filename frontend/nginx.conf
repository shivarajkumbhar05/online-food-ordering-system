server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 6m;   # matches the 5 MB upload limit in the API

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/     { proxy_pass http://backend:5000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /uploads/ { proxy_pass http://backend:5000; }

  location = /config.js { add_header Cache-Control "no-store"; }
  location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico)$ { expires 7d; }
  location / { try_files $uri $uri/ =404; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
}
