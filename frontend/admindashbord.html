<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            display:flex;
            min-height:100vh;
            background:#f4f6f9;
        }

        /* SIDEBAR */
        .sidebar{
            width:250px;
            background:linear-gradient(to bottom,#ff4b2b,#ff9800);
            color:white;
            padding:20px;
            position:fixed;
            height:100%;
        }

        .sidebar h2{
            text-align:center;
            margin-bottom:25px;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            padding:12px;
            margin:8px 0;
            border-radius:8px;
        }

        .sidebar a:hover{
            background:rgba(255,255,255,0.2);
        }

        /* MAIN */
        .main{
            margin-left:250px;
            padding:20px;
            width:100%;
        }

        /* TOPBAR */
        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:white;
            padding:15px 20px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
        }

        /* CARDS */
        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:20px;
            margin-top:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3{
            margin-bottom:10px;
            color:#444;
        }

        .card p{
            font-size:22px;
            font-weight:bold;
            color:#ff4b2b;
        }

        /* SECTION */
        .section{
            margin-top:30px;
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
        }

        .section h2{
            margin-bottom:20px;
            color:#333;
        }

        /* FORM */
        .food-form{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:15px;
            margin-bottom:20px;
        }

        .food-form input,
        .food-form select{
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
        }

        .food-form input:focus,
        .food-form select:focus{
            border-color:#ff9800;
        }

        /* TABLE */
        table{
            width:100%;
            margin-top:20px;
            border-collapse:collapse;
            background:white;
            border-radius:10px;
            overflow:hidden;
        }

        th,td{
            padding:12px;
            border-bottom:1px solid #eee;
            text-align:left;
        }

        th{
            background:#ff9800;
            color:white;
        }

        /* BUTTON */
        .btn{
            padding:10px 14px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-weight:bold;
        }

        .add-btn{
            background:#ff4b2b;
            color:white;
        }

        .edit{
            background:#2ecc71;
            color:white;
        }

        .delete{
            background:#e74c3c;
            color:white;
        }

        img.food-img{
            width:60px;
            height:60px;
            object-fit:cover;
            border-radius:8px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a href="admindashbord.html">Dashboard</a>
        <a href="users.html">Users</a>
        <a href="orders.html">Orders</a>
        <a href="products.html">Products</a>
        <a href="logout.html">Logout</a>
    </div>

    <div class="main">
        <div class="topbar">
            <h2>Dashboard</h2>
        </div>

        <div class="cards">
            <div class="card">
                <h3>Total Users</h3>
                <p>1200</p>
            </div>

            <div class="card">
                <h3>Total Orders</h3>
                <p>350</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <p>₹85,000</p>
            </div>

            <div class="card">
                <h3>Products</h3>
                <p id="productCount">2</p>
            </div>
        </div>

        <!-- Add Food Item Section -->
        <div class="section">
            <h2>Add New Food Item</h2>

            <form class="food-form" id="foodForm">
                <input type="text" id="foodName" placeholder="Food Name" required />
                <input type="text" id="foodCategory" placeholder="Category" required />
                <input type="number" id="foodPrice" placeholder="Price" required />
                <input type="text" id="foodImage" placeholder="Image URL" required />
                <button type="submit" class="btn add-btn">Add Food Item</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Food Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="foodTableBody">
                    <tr>
                        <td><img src="https://via.placeholder.com/60" class="food-img" alt="Pizza"></td>
                        <td>Pizza</td>
                        <td>Fast Food</td>
                        <td>₹250</td>
                        <td><button class="btn delete" onclick="deleteItem(this)">Delete</button></td>
                    </tr>
                    <tr>
                        <td><img src="https://via.placeholder.com/60" class="food-img" alt="Burger"></td>
                        <td>Burger</td>
                        <td>Snacks</td>
                        <td>₹150</td>
                        <td><button class="btn delete" onclick="deleteItem(this)">Delete</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const foodForm = document.getElementById("foodForm");
        const foodTableBody = document.getElementById("foodTableBody");
        const productCount = document.getElementById("productCount");

        foodForm.addEventListener("submit", function(e) {
            e.preventDefault();

            const name = document.getElementById("foodName").value;
            const category = document.getElementById("foodCategory").value;
            const price = document.getElementById("foodPrice").value;
            const image = document.getElementById("foodImage").value;

            const newRow = document.createElement("tr");
            newRow.innerHTML = `
                <td><img src="${image}" class="food-img" alt="${name}"></td>
                <td>${name}</td>
                <td>${category}</td>
                <td>₹${price}</td>
                <td><button class="btn delete" onclick="deleteItem(this)">Delete</button></td>
            `;

            foodTableBody.appendChild(newRow);

            updateProductCount();
            foodForm.reset();
        });

        function deleteItem(button) {
            button.parentElement.parentElement.remove();
            updateProductCount();
        }

        function updateProductCount() {
            productCount.textContent = foodTableBody.rows.length;
        }
    </script>

</body>
</html>
